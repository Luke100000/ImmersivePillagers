plugins {
    id "multiloader-loader"
    id "net.fabricmc.fabric-loom"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runs {
        client {
            client()
            runDir("runs/client")
        }
        server {
            server()
            runDir("runs/server")
        }
    }
}

def loaderAttribute = Attribute.of("io.github.mcgradleconventions.loader", String)
["apiElements", "runtimeElements", "sourcesElements", "includeInternal", "modCompileClasspath"].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, "fabric")
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, "fabric")
            }
        }
    }
}

processResources {
    inputs.properties(version: project.version, fabric_loader_version_range: fabric_loader_version_range,
            fabric_minecraft_version_range: fabric_minecraft_version_range,
            fabric_immersive_aircraft_version_range: fabric_immersive_aircraft_version_range)
    filesMatching("fabric.mod.json") {
        expand(version: project.version, fabric_loader_version_range: fabric_loader_version_range,
                fabric_minecraft_version_range: fabric_minecraft_version_range,
                fabric_immersive_aircraft_version_range: fabric_immersive_aircraft_version_range)
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs("-Xmx3G")
}
