plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}
loom {
    forge {
        mixinConfig "immersive_pillagers-common.mixins.json"
        mixinConfig "immersive_pillagers.mixins.json"
    }
}
architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    modImplementation("net.conczin:immersive_aircraft:${immersive_aircraft_version}+forge")
    include("net.conczin:immersive_aircraft:${immersive_aircraft_version}+forge")

    modImplementation("net.conczin:immersive_melodies:${immersive_melodies_version}+forge")
    include("net.conczin:immersive_melodies:${immersive_melodies_version}+forge")

    forgeRuntimeLibrary 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_major", rootProject.forge_version.split("\\.")[0]
    inputs.property "minecraft_version_range", rootProject.minecraft_version_range
    inputs.property "immersive_aircraft_version_range", rootProject.immersive_aircraft_version_range

    filesMatching("META-INF/mods.toml") {
        expand(
                "version": project.version,
                "loader_major": rootProject.forge_version.split("\\.")[0],
                "minecraft_version_range": rootProject.minecraft_version_range,
                "immersive_aircraft_version_range": rootProject.immersive_aircraft_version_range
        )
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            version = version + "+forge"
            from components.java
        }
    }
}
