plugins {
    id "multiloader-loader"
    id "net.neoforged.moddev.legacyforge"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}-common.mixins.json")
    config("${mod_id}.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs("-Xmx3G")
}

dependencies {
    compileOnly project(":common")
    modCompileOnly "maven.modrinth:immersive-aircraft:${immersive_aircraft_version}-forge"
    compileOnly "org.jetbrains:annotations:24.1.0"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    modRuntimeOnly "maven.modrinth:immersive-aircraft:${immersive_aircraft_version}-forge"
    modRuntimeOnly "maven.modrinth:immersive-melodies:${immersive_melodies_version}-forge"
    runtimeOnly "org.mariuszgromada.math:MathParser.org-mXparser:5.2.1"
}

jar {
    finalizedBy("reobfJar")
    manifest.attributes(["MixinConfigs": "${mod_id}-common.mixins.json,${mod_id}.mixins.json"])
}
