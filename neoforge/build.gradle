plugins {
    id "multiloader-loader"
    id "net.neoforged.moddev"
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs("-Xmx3G")
}

dependencies {
    implementation project(":common")
    compileOnly "maven.modrinth:immersive-aircraft:${immersive_aircraft_version}-neoforge"
    compileOnly "org.jetbrains:annotations:24.1.0"
    runtimeOnly "maven.modrinth:immersive-aircraft:${immersive_aircraft_version}-neoforge"
    runtimeOnly "org.mariuszgromada.math:MathParser.org-mXparser:5.2.1"
}

jar {
    manifest.attributes(["MixinConfigs": "${mod_id}-common.mixins.json,${mod_id}.mixins.json"])
}
